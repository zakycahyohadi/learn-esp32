name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # build: prerender beranda, halaman panduan, sitemap; versi file diambil dari GITHUB_SHA
      - name: Build site
        run: node tools/build.mjs
      # deploy dibatalkan kalau ada link rusak, JSON-LD tidak valid, atau meta tag bermasalah
      - name: Check site
        run: node tools/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
